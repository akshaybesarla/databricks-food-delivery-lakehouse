[project]
name = "fooddelivery"
version = "1.0.0"
description = "Shared PySpark logic for the Databricks food delivery lakehouse"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# `spark`, `dbutils` and `display` are injected by the Databricks runtime.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"pipelines/*.py" = ["E402"]   # sys.path is extended before local imports
"notebooks/*.py" = ["E402"]
